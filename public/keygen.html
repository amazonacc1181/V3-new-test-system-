<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProctorGuard V3 Encryption Key Generator</title>
<style>
body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:640px;margin:40px auto;padding:0 18px;line-height:1.5;color:#111}
button{font:inherit;padding:12px 16px;border:0;border-radius:8px;background:#111;color:white}
textarea{box-sizing:border-box;width:100%;min-height:100px;margin:12px 0;padding:12px;font:14px ui-monospace,monospace;overflow-wrap:anywhere}
.note{background:#f3f3f3;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>Encryption key generator</h1>
<p>This page generates a random 32-byte key in your browser using the built-in Web Crypto API.</p>
<p class="note"><strong>Privacy:</strong> This page contains no external scripts and does not send the generated key anywhere. Keep the key private and save it securely.</p>
<button id="generate">Generate 64-character key</button>
<textarea id="key" readonly placeholder="Tap Generate to create your key"></textarea>
<button id="copy" disabled>Copy key</button>
<p id="status" aria-live="polite"></p>
<script>
const keyField=document.getElementById('key');
const copyButton=document.getElementById('copy');
document.getElementById('generate').addEventListener('click',()=>{
 const bytes=new Uint8Array(32);
 crypto.getRandomValues(bytes);
 keyField.value=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 copyButton.disabled=false;
 document.getElementById('status').textContent='Key generated locally. Save it securely; you cannot recover it from this page later.';
});
copyButton.addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText(keyField.value);document.getElementById('status').textContent='Copied. Paste it directly into Render; do not share it in chat.';}
 catch(e){keyField.focus();keyField.select();document.getElementById('status').textContent='Tap and hold the selected key, then choose Copy.';}
});
</script>
</body>
</html>
