<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProctorGuard V3 Encryption Key Generator</title>
<style>
body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:640px;margin:32px auto;padding:0 18px;line-height:1.5;color:#111}
button{font:inherit;padding:12px 16px;border:0;border-radius:8px;background:#111;color:white;margin:8px 8px 8px 0}
textarea{box-sizing:border-box;width:100%;min-height:110px;margin:12px 0;padding:12px;font:14px ui-monospace,monospace;overflow-wrap:anywhere}
.note{background:#f3f3f3;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>Encryption key generator</h1>
<p>Tap the button to generate a random 32-byte (64-character) encryption key in this browser.</p>
<p class="note"><strong>Privacy:</strong> This page contains no external scripts and does not send the generated key anywhere. Keep the key private.</p>
<button id="generate" type="button">Generate key</button>
<textarea id="key" readonly placeholder="Your key will appear here"></textarea>
<button id="copy" type="button">Copy key</button>
<p id="status" aria-live="polite">Tap Generate key to begin.</p>
<script src="/keygen.js" defer></script>
</body>
</html>
